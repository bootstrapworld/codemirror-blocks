name: Browser Tests
on: [push, pull_request]
jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the library and starts the example page itself
      - run: npm run test:e2e

      # The same tests on the editor with Preact in place of React, which is the
      # editor's second file for a <script> tag (dist/lite)
      - name: Browser tests on Preact
        run: npm run test:e2e
        env:
          CMB_PREACT: "1"

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/codemirror-blocks/test-results
          retention-days: 7
