<!doctype html>
<!--
  A page with no bundler: the editor and a language are each a <script> tag.
  `?languages=wescheme,lambda` says which language files to load, after the editor's.
  (The test builds the files, `npm run bundle` in each package, and opens this page.)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>script tags</title>
    <link
      rel="stylesheet"
      href="../../../../node_modules/codemirror/lib/codemirror.css"
    />
    <link rel="stylesheet" href="../../dist/codemirror-blocks.css" />
    <script>
      const languages = (
        new URLSearchParams(location.search).get("languages") || ""
      )
        .split(",")
        .filter(Boolean);
      for (const l of languages) {
        document.write(
          `<link rel="stylesheet" href="../../../${l}/dist/${l}.css" />`
        );
      }
    </script>
    <style>
      #editor {
        height: 320px;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script src="../../../../node_modules/codemirror/lib/codemirror.js"></script>
    <script>
      // `?core=lite` is the editor on Preact (dist/lite), not the one on React
      const core =
        new URLSearchParams(location.search).get("core") === "lite"
          ? "../../dist/lite/codemirror-blocks-lite-min.js"
          : "../../dist/codemirror-blocks-min.js";
      document.write(`<script src="${core}"><\/script>`);
    </script>
    <script>
      for (const l of languages) {
        document.write(
          `<script src="../../../${l}/dist/${l}-min.js"><\/script>`
        );
      }
    </script>
  </body>
</html>
