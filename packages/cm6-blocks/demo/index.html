<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cm6-blocks demo (experiment)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 8px 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #ccc;
        background: #f6f6f6;
      }
      #stats {
        font-size: 12px;
        color: #555;
        margin-left: auto;
        font-family: monospace;
      }
      #app {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .codemirror-pane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #editor {
        flex: 1;
        min-height: 0;
      }
      #editor .cm-editor {
        height: 100%;
      }
      #editor .cm-scroller {
        overflow: auto;
        font-family: monospace;
        line-height: 1.5;
      }
      #editor .cm-content {
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Language
        <select id="lang">
          <option value="scheme">Scheme</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
        </select>
      </label>
      <button id="big">Load a big document (~3000 lines)</button>
      <button id="constructs">Load the constructs sample</button>
      <button id="small">Load the sample</button>
      <span id="stats"></span>
      <span
        class="TrashCan"
        role="img"
        aria-label="Trash can: drag a block here to delete it"
        title="Drag a block here to delete it"
        style="
          position: fixed;
          top: 6px;
          right: 12px;
          z-index: 5;
          background: #fff;
          padding: 2px 10px;
          border: 1px dashed #999;
          border-radius: 6px;
        "
        >&#128465; Trash</span
      >
    </header>
    <div class="Editor blocks" id="app">
      <div class="toolbar-pane">
        <!-- (the one child of the pane has no padding or border: it must be able to shrink to nothing) -->
        <!-- (the mode button floats over the top right corner of the editor, 34 px wide and 24 px from the edge: the bar stops short of it, so that a
             narrow window scrolls the buttons instead of putting one under it) -->
        <div style="padding-right: 64px">
          <div
            id="templates"
            aria-label="templates"
            style="
              padding: 4px 12px;
              border-bottom: 1px solid #ddd;
              font-size: 14px;
            "
          ></div>
        </div>
      </div>
      <div class="codemirror-pane"><div id="editor"></div></div>
    </div>
    <script src="demo.js"></script>
  </body>
</html>
