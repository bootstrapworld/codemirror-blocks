<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cm6-blocks demo (experiment)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 8px 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ccc; background: #f6f6f6; }
    #stats { font-size: 12px; color: #555; margin-left: auto; font-family: monospace; }
    #editor { flex: 1; min-height: 0; }
    #editor .cm-editor { height: 100%; }
    #editor .cm-scroller { overflow: auto; font-family: monospace; line-height: 1.5; }
    #editor .cm-content { padding: 6px 0; }
  </style>
</head>
<body>
  <header>
    <label>Language
      <select id="lang">
        <option value="scheme">Scheme</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
      </select>
    </label>
    <label><input type="checkbox" id="blocks" checked> Blocks</label>
    <button id="big">Load a big document (~3000 lines)</button>
    <button id="small">Load the sample</button>
    <span id="stats"></span>
  </header>
  <div id="editor"></div>
  <script src="demo.js"></script>
</body>
</html>
